[project]
name = "slopmarker"
version = "0.1.0"
description = "Corpus, training and export pipeline for the slop-marker AI-text detector"
requires-python = "==3.12.*"

# Base deps only. Deliberately no torch: normalize/sentences/chunking/aggregate and the
# fixture generator must run on the Windows dev box.
dependencies = [
    "numpy>=2",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6",
    "tokenizers>=0.21",
    "zstandard>=0.23",
]

[project.optional-dependencies]
# transformers is pinned by optimum-onnx, which requires <4.58 (current release is 5.x).
# ModernBERT needs >=4.48, so 4.57.6 is the only version satisfying both. One env for
# train and export so the checkpoint that trains is the checkpoint that exports.
train = [
    "torch>=2.6,<3",
    "transformers==4.57.6",
    "datasets>=3",
    "accelerate>=1",
    "scipy>=1.14",
    "pandas>=2.2",
    "wandb>=0.18",
]
export = [
    "optimum>=2.1",
    "optimum-onnx==0.1.0",
    "onnx>=1.17",
    "onnxruntime==1.29.0",
]
# raid-bench is deliberately NOT a dependency: it pins numpy<1.27 and scikit-learn<1.4,
# which would drag the whole project back to a 2023 stack. RAID is just a HF dataset
# (liamdugan/raid), so eval/raid.py reads it with `datasets` and scores it with our own
# metrics. A leaderboard submission, if we ever make one, runs raid-bench via uvx.
evaluate = ["scikit-learn>=1.5"]
corpus = [
    "datatrove>=0.10",
    "datasketch>=1.6",
    "tldextract>=5",
    "fasttext-wheel>=0.9",
    "py3langid>=0.4.0",
]
modal = ["modal>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slopmarker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "transformers.*", "optimum.*", "onnx.*", "onnxruntime.*", "torch.*",
    "datasets.*", "datatrove.*", "datasketch.*", "modal", "modal.*",
    "wandb", "raid.*", "sklearn.*", "scipy.*", "py3langid.*", "tldextract.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# These stacks never share an environment: `corpus` runs in one Modal image, `train` +
# `export` + `evaluate` in another, and local dev needs neither. Without this, uv tries
# to find one version set satisfying all of them at once and fails.
[tool.uv]
conflicts = [
    [{ extra = "corpus" }, { extra = "train" }],
    [{ extra = "corpus" }, { extra = "export" }],
    [{ extra = "corpus" }, { extra = "evaluate" }],
]

[tool.ruff.lint.per-file-ignores]
# Ambiguous Unicode characters are the entire point of the fixture inputs.
"scripts/make_fixtures.py" = ["RUF001"]
